project_id = "matchwork"

[db]
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback/", "http://localhost:4173/auth/callback/", "http://localhost:3100/auth/callback/", "https://localhost:8443/auth/callback/"]
enable_signup = true
# Debe coincidir con la validación del frontend (8 caracteres).
minimum_password_length = 8
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
# En local no hay correo (se omite mailpit), por eso la confirmación está apagada.
# En producción debe estar ACTIVA (ver docs/security/auth-produccion.md).
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.rate_limit]
sign_in_sign_ups = 30
token_refresh = 150
